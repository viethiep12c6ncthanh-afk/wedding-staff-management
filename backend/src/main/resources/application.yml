spring:
  application:
    name: wedding-staff-management
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/wedding_staff_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: "${JWT_SECRET}"
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  seed:
    enabled: ${SEED_ENABLED:false}
    admin-password: "${SEED_ADMIN_PASSWORD:}"
    coordinator-password: "${SEED_COORDINATOR_PASSWORD:}"
    employee-password: "${SEED_EMPLOYEE_PASSWORD:}"
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:OLLAMA}
    base-url: "${AI_BASE_URL:}"
    api-key: "${AI_API_KEY:}"
    model: "${AI_MODEL:}"
    timeout-ms: ${AI_TIMEOUT_MS:60000}
    candidate-limit: ${AI_CANDIDATE_LIMIT:5}
    recent-evaluation-limit: ${AI_RECENT_EVALUATION_LIMIT:3}

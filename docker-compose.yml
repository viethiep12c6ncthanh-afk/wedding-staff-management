services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wedding_staff_management
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_seed_reference.sql:/docker-entrypoint-initdb.d/02_seed_reference.sql:ro
      - ./database/migrations/V013__operational_audit.sql:/docker-entrypoint-initdb.d/03_operational_audit.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/wedding_staff_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JPA_DDL_AUTO: validate
      SEED_ENABLED: "false"
      ATTENDANCE_DEMO_ENABLED: ${ATTENDANCE_DEMO_ENABLED:-false}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-OLLAMA}
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:11434}
      AI_MODEL: ${AI_MODEL:-qwen3:4b-instruct}
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8088}:80"

volumes:
  mysql_data:
